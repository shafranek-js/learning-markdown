name: Markdown upstream conformance audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'vendor/marked.js'
      - 'tests/conformance.mjs'
      - '.github/workflows/conformance.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare against all official upstream examples
        run: node tests/conformance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-conformance-report
          path: conformance-report/
          if-no-files-found: warn
