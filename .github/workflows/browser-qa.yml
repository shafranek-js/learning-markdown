name: Markdown browser UX QA
on:
  workflow_dispatch:
  # Pull requests are covered by browser-tests.yml; avoid rerunning
  # the same full suite on every feature-branch push.
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'tests/browser/**'
      - 'sw.js'
      - 'scripts/postbuild.mjs'
      - 'playwright.config.js'
      - '.github/workflows/browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: markdown-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-qa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
