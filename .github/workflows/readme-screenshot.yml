name: Capture README screenshot
on:
  push:
    branches:
      - docs/readme-release-guide-20261026
    paths:
      - scripts/capture-readme.mjs
      - .github/workflows/readme-screenshot.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-screenshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    if: github.repository == 'shafranek-js/learning-markdown' && github.ref == 'refs/heads/docs/readme-release-guide-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-readme.mjs
      - name: Commit the real screenshot to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/readme-studio.png
          if git diff --cached --quiet; then
            echo "README screenshot unchanged."
          else
            git commit -m "docs: capture current Split View for README"
            git fetch origin docs/readme-release-guide-20261026
            git rebase origin/docs/readme-release-guide-20261026
            git push origin HEAD:docs/readme-release-guide-20261026
          fi
